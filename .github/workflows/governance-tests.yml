name: 📋 Governance Tests

run-name: Validate governance documentation.

on:
  push:
  pull_request:

jobs:
  governance-tests:
    name: Governance documentation tests
    runs-on: ubuntu-latest

    steps:
      # Fetch the repository content.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Use the Python version targeted by the project.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install project and test dependencies.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Run only governance documentation tests.
      - name: Run governance tests
        run: |
          pytest \
            tests/test_agent_card.py \
            tests/test_runbook.py \
            -v

      # Publish a concise summary in GitHub Actions.
      - name: Write governance test summary
        if: always()
        run: |
          {
            echo "## 📋 Governance Tests"
            echo ""
            echo "Validate governance documentation."
            echo ""
            echo "Executed test files:"
            echo "- tests/test_agent_card.py"
            echo "- tests/test_runbook.py"
          } >> "$GITHUB_STEP_SUMMARY"
