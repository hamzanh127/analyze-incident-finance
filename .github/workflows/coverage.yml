name: 📈 Coverage Report

run-name: Generate project coverage report.

on:
  push:
  pull_request:

jobs:
  coverage:
    name: Generate coverage report
    runs-on: ubuntu-latest

    steps:
      # Fetch the repository content.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Use the Python version targeted by the project.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install runtime and development dependencies.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest-cov

      # Generate terminal, XML, and HTML coverage reports.
      - name: Run coverage
        run: |
          pytest \
            --cov=app \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            --cov-fail-under=70

      # Upload the browsable HTML coverage report.
      - name: Upload HTML coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov/

      # Publish the total coverage percentage in GitHub Actions.
      - name: Write coverage summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path

          coverage_path = Path("coverage.xml")
          print("## 📈 Coverage Report")
          print("")
          print("Generate project coverage report.")
          print("")
          if coverage_path.exists():
              root = ET.parse(coverage_path).getroot()
              line_rate = float(root.attrib.get("line-rate", 0.0)) * 100
              print(f"Total coverage: **{line_rate:.2f}%**")
              print("")
              print("HTML artifact: `htmlcov/`")
          else:
              print("Coverage file `coverage.xml` was not generated.")
          PY
